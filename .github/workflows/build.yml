name: Build & Release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.x
          channel: stable
          cache: true

      - name: Read version
        id: ver
        run: |
          V=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - name: Generate Android project
        run: |
          mkdir -p /tmp/keep
          cp -r pubspec.yaml lib assets analysis_options.yaml /tmp/keep/ 2>/dev/null || true
          flutter create . --platforms=android --project-name kalori_hesaplayici --org com.departures --overwrite
          rm -rf lib assets pubspec.yaml analysis_options.yaml
          cp -r /tmp/keep/. .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py

      # İmza: yalnızca GitHub secret'ları. Geçici anahtar ÜRETİLMEZ, varsayılan şifre YOKTUR.
      # Yeni adlar (tüm depolarda aynı): ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASS,
      # ANDROID_KEY_PASS, ANDROID_KEY_ALIAS. Eski ad KEYSTORE_BASE64 yalnızca anahtar dosyası için okunur.
      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 || secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS || secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::İmza secret'ları eksik (ANDROID_KEYSTORE_B64 + ANDROID_KEYSTORE_PASS). Yayın yapılmadı."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ -z "$KEY_ALIAS" ]; then
            KEY_ALIAS=$(keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" 2>/dev/null | grep -m1 PrivateKeyEntry | cut -d, -f1)
          fi
          [ -n "$KEY_ALIAS" ] || { echo "::error::Anahtar adı (alias) bulunamadı"; exit 1; }
          {
            echo "KALORI_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "KALORI_STORE_PASS=$KS_PASS"
            echo "KALORI_KEY_PASS=${KEY_PASS:-$KS_PASS}"
            echo "KALORI_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # Hiçbir yapay zekâ anahtarı derlemeye verilmez (--dart-define yok).
      - name: Build APK
        run: |
          flutter build apk --release
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/KaloriHesaplayici-v${{ steps.ver.outputs.version }}.apk"
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaloriHesaplayici-v${{ steps.ver.outputs.version }}
          path: out/*.apk

      - name: Release notes
        id: notes
        run: |
          {
            echo "body<<EOF"
            echo "Kalori Hesaplayıcı v${{ steps.ver.outputs.version }}"
            echo
            git log -1 --pretty=%B | head -20
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: out/*.apk
          make_latest: true
